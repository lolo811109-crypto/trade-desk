<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trade Desk · 交易台</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@property --ac{syntax:'<color>';inherits:true;initial-value:#18181B}
:root{--ac:#18181B;--bg:#F5F5F7;--bd:#E5E7EB;--tx:#18181B;--mu:#8E8E93;--gr:#10B981;--rd:#F43F5E;transition:--ac .5s ease}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:Inter,-apple-system,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.top{background:rgba(245,245,247,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--bd);padding:10px 12px 8px;padding-top:calc(10px + env(safe-area-inset-top));flex:none;z-index:5}
.tin{max-width:480px;margin:0 auto}
.tt{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.tt b{font-size:17px;font-weight:800;letter-spacing:-.02em}.tt b i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ac);margin-right:7px;box-shadow:0 0 10px var(--ac)}
.mono{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--mu);letter-spacing:.06em;text-transform:uppercase}
.seg{display:flex;background:#E9E9EC;border-radius:12px;padding:3px;position:relative}
.seg .ind{position:absolute;top:3px;bottom:3px;border-radius:9px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.1);transition:left .35s cubic-bezier(.3,.9,.3,1),width .35s}
.seg button{flex:1;position:relative;border:0;background:none;padding:8px 0;font:700 12.5px Inter;color:var(--mu);cursor:pointer;transition:color .3s}
.seg button.on{color:var(--ac)}
main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;pointer-events:none;transition:opacity .35s}
iframe.on,#ov.on{opacity:1;pointer-events:auto}
#ov{position:absolute;inset:0;overflow:auto;opacity:0;pointer-events:none;transition:opacity .35s}
.wrap{max-width:480px;margin:0 auto;padding:14px 16px 56px}
.sum{background:#111;color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.sum .v{font-size:32px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.card{background:#fff;border:1px solid var(--bd);border-radius:18px;box-shadow:0 8px 24px rgba(17,24,39,.05);padding:14px 16px;margin-bottom:12px;cursor:pointer;position:relative;overflow:hidden;transition:transform .15s}
.card:active{transform:scale(.98)}
.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nm{font-weight:800;font-size:15px}.nm i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:7px}
.eq{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pl{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.pill{font:700 9.5px "JetBrains Mono",monospace;padding:4px 8px;border-radius:99px;background:#ECFDF5;color:var(--gr)}.pill.halt{background:#FFF1F2;color:var(--rd)}.pill.n{background:#F2F2F4;color:var(--mu)}
.subs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.sub{background:#F5F5F7;border-radius:9px;padding:5px 8px;font-size:11px;font-variant-numeric:tabular-nums}.sub b{display:block;font-size:13px}
svg.sp{width:100%;height:44px;margin-top:6px;overflow:visible}
.ft{font-size:11px;color:var(--mu);text-align:center;margin-top:10px;line-height:1.5}
.shf{display:flex;justify-content:space-between;align-items:center;background:#0D1117;color:#E6EDF3;border-radius:14px;padding:8px 12px;margin-bottom:8px}.shf .st{font-weight:800;font-size:14px}.shf .mono{color:#7D8590;font-size:9.5px}.shf .sv{font:800 22px "JetBrains Mono",monospace;letter-spacing:-.03em;line-height:1.1}
</style></head><body>
<div class="top"><div class="tin"><div class="tt"><b><i></i>Trade Desk 交易台</b><span class="mono" id="clk"></span></div>
<div class="shf" id="shf"><div><div class="st" id="sst">—</div><div class="mono" id="sw">—</div></div><div style="text-align:right"><div class="sv" id="spl">—</div><div id="ssp"></div></div></div>
<div class="seg" id="seg"><div class="ind" id="ind"></div><button data-m="ov">总览</button><button data-m="bsc">BNB</button><button data-m="sol">SOL</button><button data-m="poly">POLY</button><button data-m="btc">BTC</button></div></div></div>
<main id="main"><div id="ov"><div class="wrap">
<div class="sum"><div class="mono" style="color:#aaa">模拟总权益 · ALL PAPER ACCOUNTS</div><div class="v" id="tot">—</div><div class="pl" id="totp"></div></div>
<div id="ovpipe"></div><div id="cards"></div>
<div class="ft">全部为模拟盘真实数据，不涉及真实资金 · 数据约每 5 分钟导出 · 页面每 60 秒刷新（UTC+8）<br><a href="../" style="color:var(--mu)">返回首页 / 经典版</a></div></div></div></main>
<script src="ui.js"></script>
<script>
const M={ov:{c:'#18181B'},bsc:{c:'#F0B90B',src:'../bsc2/'},sol:{c:'#9945FF',src:'../sol2/'},poly:{c:'#2E5CFF',src:'../copy2/'},btc:{c:'#F7931A',src:'btc.html'}};
const $=id=>document.getElementById(id),f2=n=>n==null?'—':n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),pc=n=>(n>=0?'+':'')+(n*100).toFixed(2)+'%',col=n=>n>=0?'var(--gr)':'var(--rd)';
const q=new URLSearchParams(location.search),nomodal=q.has('nomodal');
setInterval(()=>{const s=TDUI.shift();$('sst').textContent=(s.night?'🌙 夜班':'☀️ 白天')+' '+String(s.h).padStart(2,'0')+':'+String(s.m).padStart(2,'0')+' UTC+8'},1000);
setInterval(()=>$('clk').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false,timeZone:'Asia/Shanghai'})+' UTC+8',1000);
const frames={};
function go(m,push){if(!M[m])m='ov';localStorage.deskTab=m;document.documentElement.style.setProperty('--ac',M[m].c);
 const bs=[...document.querySelectorAll('#seg button')];bs.forEach(b=>b.classList.toggle('on',b.dataset.m==m));const b=bs.find(x=>x.dataset.m==m);$('ind').style.left=b.offsetLeft+'px';$('ind').style.width=b.offsetWidth+'px';
 if(m!='ov'&&!frames[m]){const f=document.createElement('iframe');f.src=M[m].src+(nomodal?'?nomodal':'');f.title=m;$('main').appendChild(f);frames[m]=f}
 $('ov').classList.toggle('on',m=='ov');for(const k in frames)frames[k].classList.toggle('on',k==m);
 if(push!==false){q.set('m',m=='ov'?'ov':m);history.replaceState(null,'','?'+q.toString())}}
$('seg').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.m)};
async function j(u){try{const r=await fetch(u+'?t='+Date.now());return r.ok?await r.json():null}catch(e){return null}}
function spark(h,c,base){h=(h||[]).slice(-200);if(h.length<2)return'<svg class="sp"></svg>';const ys=h.map(p=>p[1]),x0=h[0][0],x1=h.at(-1)[0],lo=Math.min(...ys,base??Infinity),hi=Math.max(...ys,base??-Infinity),r=hi-lo||1;
 const P=h.map(p=>[(p[0]-x0)/(x1-x0||1)*400,40-(p[1]-lo)/r*36]),d='M'+P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L'),L=P.at(-1),by=base!=null?40-(base-lo)/r*36:null;
 return `<svg class="sp" viewBox="0 0 400 44" preserveAspectRatio="none">${by!=null?`<line x1="0" x2="400" y1="${by}" y2="${by}" stroke="#C7C7CC" stroke-dasharray="3 4" vector-effect="non-scaling-stroke"/>`:''}<path d="${d}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="${L[0]}" cy="${L[1]}" r="3.5" fill="${c}"/></svg>`}
const sub=(n,o)=>o?.equity!=null?`<div class="sub">${n}<b style="color:${col(o.equity-1000)}">$${f2(o.equity)}</b></div>`:'';
function reg(y){const n=y.length,tm=(n-1)/2,ym=y.reduce((a,b)=>a+b)/n;let c=0,v=0;y.forEach((p,i)=>{c+=(i-tm)*(p-ym);v+=(i-tm)**2});const s=c/v,a=ym-s*tm;let e=0,t=0;y.forEach((p,i)=>{e+=(p-a-s*i)**2;t+=(p-ym)**2});return{r2:t?1-e/t:0,sp:s/ym*100}}
async function load(){const[bs,bv,bc,bd,ss,sv,sv3,sd,pe,pt]=await Promise.all(['../bsc/data/state.json','../bsc/data/state_v2.json','../bsc/data/paper_state_conf.json','../bsc/data/desk.json','../sol/data/state.json','../sol/data/state_v2.json','../sol/data/state_v3.json','../sol/data/desk.json','../copy/data/state.json','../copy/data/state_t.json'].map(j));
 let kl=null;try{kl=await (await fetch('https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=120')).json()}catch(e){}
 const conf=bc?.equity!=null?bc:(bd?.confluence||null);
 const accts=[bs,bv,conf,ss,sv,pe,pt].filter(o=>o?.equity!=null),tot=accts.reduce((a,o)=>a+o.equity,0),n=accts.length;
 $('tot').textContent='$'+f2(tot);$('totp').innerHTML=`<span style="color:${tot>=n*1000?'#34D399':'#FB7185'}">${tot-n*1000>=0?'+':'−'}$${f2(Math.abs(tot-n*1000))} · ${pc(tot/(n*1000)-1)}</span> <span class="mono" style="color:#888">${n} 个账户 VS $${(n*1000).toLocaleString()}</span>`;
 const card=(m,name,main,subs,pill,hist)=>{const c=M[m].c;const d=main?.equity!=null?main.equity-1000:null;return `<div class="card" style="--c:${c}" data-m="${m}"><div class="row"><span class="nm"><i></i>${name}</span>${pill}</div>
 <div class="row" style="margin-top:6px"><span class="eq">${main?.equity!=null?'$'+f2(main.equity):'—'}</span><span class="pl" style="color:${d==null?'var(--mu)':col(d)}">${d==null?'':pc(d/1000)}</span></div>${spark(hist,c,1000)}<div class="subs">${subs}</div></div>`};
 const bh=bd?.halt?.halted,sh=sd?.halt?.halted;
 const ws=Object.values(pe?.wallets||{}),out=ws.filter(o=>o.cashout||o.cash<5).length;
 let btc='';if(kl&&kl.length){const px=kl.map(x=>+x[4]),r=reg(px.slice(-15)),sg=(r.r2>=.6&&r.sp>=.01)?'LONG':(r.r2>=.6&&r.sp<=-.01)?'SHORT':'观望',ch=px.at(-1)/px[0]-1;
  btc=`<div class="card" style="--c:#F7931A" data-m="btc"><div class="row"><span class="nm"><i></i>BTC 回归信号</span><span class="pill ${sg=='SHORT'?'halt':sg=='LONG'?'':'n'}">${sg}</span></div>
  <div class="row" style="margin-top:6px"><span class="eq">$${f2(px.at(-1))}</span><span class="pl" style="color:${col(ch)}">${pc(ch)} <span class="mono">2H</span></span></div>${spark(kl.map(x=>[x[0],+x[4]]),'#F7931A')}
  <div class="subs"><div class="sub">斜率 SLOPE<b>${r.sp.toFixed(4)}%</b></div><div class="sub">R²<b>${r.r2.toFixed(3)}</b></div><div class="sub">参数<b>W15 · 0.01 · 0.6</b></div></div></div>`}
 $('cards').innerHTML=card('bsc','BNB Chain Meme',bv,sub('原版',bs)+sub('V2',bv)+sub('共振',conf),`<span class="pill ${bh?'halt':''}">${bh?'HALTED':'ACTIVE'}</span>`,bv?.history)
  +card('sol','Solana Meme',sv,sub('原版',ss)+sub('V2',sv),`<span class="pill ${sh?'halt':''}">${sh?'HALTED':'ACTIVE'}</span>`,sv?.history)
  +card('poly','Polymarket 跟单',pe,sub('平均分配',pe)+sub('淘汰赛',pt),`<span class="pill ${out>ws.length/2?'halt':''}">${out}/${ws.length} CASH OUT</span>`,pe?.history)+btc;
 try{const s=TDUI.shift(),r=TDUI.shiftPnl([bs,bv,conf,ss,sv,pe,pt],s.start);$('sw').textContent=(s.night?'今晚':'今天')+' '+TDUI.hm(s.start)+' 起 · '+(r?r.n:0)+' 个账户';
  if(r){const c=r.pnl>=0?'#3FB950':'#F85149';$('spl').style.color=c;$('spl').textContent=(r.pnl>=0?'+':'−')+'$'+Math.abs(r.pnl).toFixed(2);$('ssp').innerHTML=TDUI.sparkSvg(r.pts,c)}else{$('spl').textContent='—'}
  TDUI.pipe($('ovpipe'),TDUI.merge([TDUI.events(bv,'BNB'),TDUI.events(sv,'SOL'),TDUI.events(sv3,'SOL v3'),TDUI.events(pe,'POLY')]),'#58A6FF','今日流程 · 全部市场');
  TDUI.ticker(TDUI.tickerMerge([TDUI.tickerLines(bv,'BNB'),TDUI.tickerLines(sv,'SOL'),TDUI.tickerLines(sv3,'SOL v3'),TDUI.tickerLines(pe,'POLY')]))}catch(e){console.error(e)}
 document.querySelectorAll('.card').forEach(c=>c.onclick=()=>go(c.dataset.m))}
go(q.get('m')=='ov'?'ov':(M[q.get('m')]?q.get('m'):(localStorage.deskTab||'ov')),!!q.get('m'));
addEventListener('resize',()=>go(localStorage.deskTab,false));load();setInterval(load,60000);
</script></body></html>
